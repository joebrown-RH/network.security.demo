---
- name: CVE Emergency Network Lockdown
  hosts: all
  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000

  rules:
    - name: Trigger emergency ACL lockdown on critical CVE
      condition: event.payload.severity == "critical" and event.payload.action == "lockdown"
      action:
        run_workflow_template:
          name: "Network - CVE Emergency Lockdown"
          organization: "Default"
          extra_vars:
            cve_id: "{{ event.payload.cve_id }}"
            blocked_port: "{{ event.payload.port }}"
            blocked_protocol: "{{ event.payload.protocol }}"

    - name: Log non-critical CVE alerts
      condition: event.payload.severity != "critical" and event.payload.action == "lockdown"
      action:
        debug:
          msg: >-
            Non-critical CVE received: {{ event.payload.cve_id }}
            (severity={{ event.payload.severity }}).
            Manual review required. No automatic lockdown triggered.
