---
controller_workflows:
  - name: "Network - CVE Emergency Lockdown"
    description: >-
      Automated CVE-driven network lockdown workflow.
      Backs up config, applies emergency ACLs, validates,
      and creates a ServiceNow change request for audit trail.
    organization: "{{ _org }}"
    ask_variables_on_launch: true
    extra_vars:
      cve_id: CVE-UNKNOWN
      blocked_port: "445"
      blocked_protocol: tcp
    related:
      workflow_nodes:
        - identifier: Backup Config
          related:
            success_nodes:
              - identifier: ACL Lockdown
          unified_job_template:
            name: "Network - Backup Config"
            organization:
              name: "{{ _org }}"
            type: job_template

        - identifier: ACL Lockdown
          related:
            success_nodes:
              - identifier: Validate Lockdown
            failure_nodes:
              - identifier: ACL Remove (Rollback)
          unified_job_template:
            name: "Network - ACL Lockdown"
            organization:
              name: "{{ _org }}"
            type: job_template

        - identifier: Validate Lockdown
          related:
            success_nodes:
              - identifier: Create ServiceNow CR
          unified_job_template:
            name: "Network - Validate Lockdown"
            organization:
              name: "{{ _org }}"
            type: job_template

        - identifier: Create ServiceNow CR
          unified_job_template:
            name: "Network - Create ServiceNow CR"
            organization:
              name: "{{ _org }}"
            type: job_template

        - identifier: ACL Remove (Rollback)
          unified_job_template:
            name: "Network - ACL Remove"
            organization:
              name: "{{ _org }}"
            type: job_template
